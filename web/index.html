<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dubai Bus Heatmap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Layer toggles; later tasks append their own controls here. -->
  <div id="controls">
    <h1>Dubai Bus Heatmap</h1>
    <div id="layer-controls"></div>
    <div id="passenger-controls" hidden>
      <label>Month <select id="month-select"></select></label>
      <label><input type="radio" name="direction" value="in" checked> In</label>
      <label><input type="radio" name="direction" value="out"> Out</label>
    </div>
  </div>

  <div id="sample-badge" hidden>SAMPLE DATA</div>
  <div id="empty-state" hidden>No data available. Run the exporter to generate <code>web/data/stops.json</code>.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
  <script src="app.js"></script>
</body>
</html>
